<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Código de Barras</title>
    <style>
        /* Estilos básicos para deixar a interface limpa e legível */
        body { 
            font-family: Arial, sans-serif; 
            transition: background-color 0.2s ease; /* Transição suave de cor */
            padding: 20px; 
            background-color: #ffffff; /* Fundo padrão inicial */
        }
        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 25px; 
            border-radius: 8px; 
            max-width: 800px; 
            margin: 0 auto; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
        }
        .group { 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }
        textarea { 
            flex-grow: 1; 
            height: 60px; 
            padding: 10px;
            resize: vertical;
        }
        input[type="color"] {
            width: 50px;
            height: 50px;
            cursor: pointer;
            border: 1px solid #ccc;
        }
        .scanner-group { 
            margin: 30px 0; 
            padding: 20px;
            background: #f0f0f0;
            border-radius: 8px;
        }
        #scanner { 
            width: 100%; 
            padding: 15px; 
            font-size: 1.5em; 
            box-sizing: border-box;
            border: 2px solid #333;
        }
        #log-area { margin-top: 20px; }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 15px; 
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 10px; 
            text-align: left; 
        }
        th { background-color: #f8f8f8; }
        button { 
            padding: 10px 15px; 
            font-size: 1em;
            cursor: pointer; 
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Configuração das Listas</h2>
        
        <div class="group">
            <textarea id="list1" placeholder="Cole a Lista 1 aqui (separe os itens por espaço, vírgula ou ponto e vírgula)"></textarea>
            <input type="color" id="color1" value="#ff0000" title="Cor da Lista 1 (Padrão: Vermelho)">
        </div>
        
        <div class="group">
            <textarea id="list2" placeholder="Cole a Lista 2 aqui (separe os itens por espaço, vírgula ou ponto e vírgula)"></textarea>
            <input type="color" id="color2" value="#ffa500" title="Cor da Lista 2 (Padrão: Laranja)">
        </div>

        <div class="scanner-group">
            <h2>Leitor de Código de Barras</h2>
            <p>Clique no campo abaixo e utilize o leitor:</p>
            <input type="text" id="scanner" placeholder="Aguardando código..." autofocus>
        </div>

        <div id="log-area">
            <h2>Histórico de Leituras</h2>
            <button id="copyBtn">Copiar Histórico</button>
            <table id="logTable">
                <thead>
                    <tr>
                        <th>Código Escaneado</th>
                        <th>Encontrado na lista</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Referências aos elementos do HTML
            const list1Input = document.getElementById("list1");
            const color1Input = document.getElementById("color1");
            const list2Input = document.getElementById("list2");
            const color2Input = document.getElementById("color2");
            const scannerInput = document.getElementById("scanner");
            const logTableBody = document.querySelector("#logTable tbody");
            const copyBtn = document.getElementById("copyBtn");

            // Função que transforma a string gigante em um array limpo
            function parseList(text) {
                // Divide usando espaço, vírgula ou ponto-e-vírgula e remove espaços vazios
                return text.split(/[\s,;]+/).filter(item => item.trim() !== "");
            }

            // Escuta as teclas digitadas no campo do leitor
            scannerInput.addEventListener("keypress", function(e) {
                // Verifica se a tecla pressionada foi o "Enter"
                if (e.key === "Enter") {
                    const code = this.value.trim();
                    if (!code) return; // Se estiver vazio, ignora

                    // Pega as listas no momento do scan
                    const list1 = parseList(list1Input.value);
                    const list2 = parseList(list2Input.value);
                    
                    let resultText = "";
                    let bgColor = "#ffffff"; // Branco por padrão

                    // Verifica em qual lista está
                    if (list1.includes(code)) {
                        bgColor = color1Input.value;
                        resultText = "1";
                    } else if (list2.includes(code)) {
                        bgColor = color2Input.value;
                        resultText = "2";
                    } else {
                        resultText = "Não encontrado";
                    }

                    // Altera a cor do fundo do site
                    document.body.style.backgroundColor = bgColor;

                    // Registra no histórico (no topo da tabela)
                    const row = document.createElement("tr");
                    
                    const cellCode = document.createElement("td");
                    cellCode.textContent = code;
                    
                    const cellResult = document.createElement("td");
                    cellResult.textContent = resultText;
                    
                    row.appendChild(cellCode);
                    row.appendChild(cellResult);
                    logTableBody.prepend(row); // prepend insere a nova linha sempre acima das antigas

                    // Limpa o campo do scanner para o próximo código
                    this.value = "";
                }
            });

            // Lógica para copiar o histórico para a área de transferência
            copyBtn.addEventListener("click", () => {
                let textToCopy = "Código\tResultado\n"; // \t (tabulação) separa bem para colar no Excel/Planilhas
                
                const rows = logTableBody.querySelectorAll("tr");
                if (rows.length === 0) {
                    alert("O histórico está vazio!");
                    return;
                }

                rows.forEach(row => {
                    const cells = row.querySelectorAll("td");
                    if (cells.length === 2) {
                        textToCopy += `${cells[0].textContent}\t${cells[1].textContent}\n`;
                    }
                });

                // Tenta copiar para a área de transferência usando a API do navegador
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert("Histórico copiado com sucesso! Você já pode colar (Ctrl+V) no Excel ou Bloco de Notas.");
                }).catch(err => {
                    alert("Erro ao copiar o histórico: " + err);
                });
            });
        });
    </script>
</body>
</html>
